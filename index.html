<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌱 Green City</title>

<style>

/* ===== RESET ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Segoe UI',sans-serif;
    background:
    linear-gradient(to bottom,#dffff0,#f7fff7);
}

/* ===== MENU ===== */

#menu{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    gap:18px;

    animation:menuOpen 0.7s ease;
}

@keyframes menuOpen{
    from{
        opacity:0;
        transform:translateY(60px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.title{
    font-size:clamp(45px,8vw,95px);
    color:#1d8b2f;
    margin-bottom:20px;

    text-shadow:
    0 5px 15px rgba(0,0,0,0.15);
}

/* ===== BUTTON ===== */

button{
    border:none;
    outline:none;

    padding:15px 35px;

    font-size:clamp(17px,2vw,28px);

    border-radius:18px;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
        135deg,
        #59df59,
        #279327
    );

    box-shadow:
    0 8px 20px rgba(0,0,0,0.18);

    transition:0.25s;
}

button:hover{
    transform:translateY(-3px) scale(1.03);
}

/* ===== GAME ===== */

#game{
    position:absolute;
    inset:0;

    display:none;

    opacity:0;
    transform:translateY(60px);
}

#game.show{
    display:flex;
    animation:gameOpen 0.5s ease forwards;
}

@keyframes gameOpen{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ===== CITY ===== */

#city{
    width:40%;
    display:grid;
    background:#a7f3a7;
}

.tile{
    border:1px solid rgba(255,255,255,0.3);
    position:relative;
    overflow:hidden;
}

.tile.gray{
    background:#727272;
}

.tile.green{
    background:
    linear-gradient(
        to bottom,
        #7dff72,
        #42be42
    );

    animation:greenGrow 0.4s ease;
}

@keyframes greenGrow{
    from{
        transform:scale(0.8);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.tree{
    position:absolute;
    font-size:clamp(18px,2vw,34px);

    animation:pop 0.5s ease;
}

.flower{
    position:absolute;
    font-size:clamp(12px,1vw,18px);

    animation:pop 0.6s ease;
}

@keyframes pop{
    from{
        transform:scale(0);
    }
    to{
        transform:scale(1);
    }
}

/* ===== RIGHT ===== */

#cardsArea{
    width:60%;
    background:#f4fff4;

    display:flex;
    flex-direction:column;

    align-items:center;

    overflow:auto;
}

/* ===== TOP ===== */

#top{
    width:100%;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 20px;
}

#score{
    font-size:clamp(20px,2vw,34px);
    font-weight:bold;
    color:#168116;
}

/* ===== MESSAGE ===== */

#message{
    font-size:clamp(24px,3vw,48px);
    color:#199919;
    font-weight:bold;

    margin-top:10px;
    text-align:center;
}

/* ===== CARDS ===== */

#cards{
    width:100%;

    display:grid;

    justify-items:center;

    gap:16px;

    padding:20px;
}

/* ===== CARD ===== */

.card{
    width:min(18vw,125px);
    height:min(18vw,125px);

    min-width:70px;
    min-height:70px;

    border-radius:22px;

    background:
    linear-gradient(
        135deg,
        #2e4156,
        #1b2d3f
    );

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-size:clamp(30px,4vw,60px);

    cursor:pointer;

    transition:0.25s;

    box-shadow:
    0 10px 20px rgba(0,0,0,0.18);
}

.card:hover{
    transform:translateY(-4px);
}

.card.open{
    background:white;
    color:black;

    transform:rotateY(180deg);
}

.card.done{
    background:
    linear-gradient(
        135deg,
        #7eff7e,
        #3db63d
    );

    color:white;
}

/* ===== GUIDE ===== */

#guidePage{
    position:absolute;
    inset:0;

    background:
    rgba(0,0,0,0.4);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

#guideBox{
    width:min(90%,650px);

    background:white;

    padding:35px;

    border-radius:28px;

    text-align:center;

    animation:guideOpen 0.4s ease;
}

@keyframes guideOpen{
    from{
        opacity:0;
        transform:scale(0.8);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

#guideBox h1{
    color:#1f932f;
    margin-bottom:20px;
}

#guideBox p{
    margin:12px 0;
    font-size:20px;
    color:#444;
}

/* ===== MOBILE ===== */

@media(max-width:900px){

    #game{
        flex-direction:column;
    }

    #city{
        width:100%;
        height:35%;
    }

    #cardsArea{
        width:100%;
        height:65%;
    }

    .card{
        width:min(20vw,95px);
        height:min(20vw,95px);
    }
}

@media(max-width:500px){

    .title{
        font-size:48px;
    }

    button{
        width:80%;
    }

    #city{
        height:30%;
    }

    #cardsArea{
        height:70%;
    }

    .card{
        width:72px;
        height:72px;
        font-size:32px;
    }

    #cards{
        gap:8px;
        padding:10px;
    }

    #message{
        font-size:24px;
    }
}

</style>
</head>

<body>

<!-- ===== MENU ===== -->

<div id="menu">

    <h1 class="title">🌱 GREEN CITY</h1>

    <button onclick="startGame('easy')">
        Easy
    </button>

    <button onclick="startGame('medium')">
        Medium
    </button>

    <button onclick="startGame('hard')">
        Hard
    </button>

    <button onclick="openGuide()">
        📖 Hướng dẫn
    </button>

</div>

<!-- ===== GAME ===== -->

<div id="game">

    <div id="city"></div>

    <div id="cardsArea">

        <div id="top">

            <button onclick="backMenu()">
                🏠 Menu
            </button>

            <div id="score">
                🌱 0
            </div>

        </div>

        <div id="message"></div>

        <div id="cards"></div>

    </div>

</div>

<!-- ===== GUIDE ===== -->

<div id="guidePage">

    <div id="guideBox">

        <h1>📖 Cách Chơi</h1>

        <p>🎴 Lật 2 thẻ giống nhau để ghép cặp</p>
        <p>🌱 Ghép đúng sẽ xanh hóa thành phố</p>
        <p>🏆 Xanh toàn bộ để chiến thắng</p>
        <p>⚡ Càng khó càng nhiều thẻ</p>

        <button onclick="closeGuide()">
            ⬅ Quay lại
        </button>

    </div>

</div>

<script>

/* ===== ICONS ===== */

const icons=[
"🌳","🌻","🍀","🌵","🌴",
"🌷","🌲","🌺","🍃","🌼",
"🌱","🪴","🌹","☘️","🍂"
];

let first=null;
let second=null;
let lock=false;

let matched=0;
let totalPairs=0;
let greenIndex=0;

/* ===== START GAME ===== */

function startGame(level){

    const game=document.getElementById("game");

    document.getElementById("menu").style.display="none";

    game.style.display="flex";

    requestAnimationFrame(()=>{
        game.classList.add("show");
    });

    let pairs;
    let cityCount;
    let columns;

    if(level==="easy"){
        pairs=6;
        cityCount=25;
        columns=3;
    }

    else if(level==="medium"){
        pairs=10;
        cityCount=49;
        columns=4;
    }

    else{
        pairs=15;
        cityCount=81;
        columns=5;
    }

    totalPairs=pairs;
    matched=0;
    greenIndex=0;

    createCity(cityCount);
    createCards(pairs,columns);

    document.getElementById("message").innerHTML="";
    document.getElementById("score").innerHTML="🌱 0";
}

/* ===== CREATE CITY ===== */

function createCity(count){

    const city=document.getElementById("city");

    city.innerHTML="";

    const size=Math.sqrt(count);

    city.style.gridTemplateColumns=
    `repeat(${size},1fr)`;

    for(let i=0;i<count;i++){

        const tile=document.createElement("div");

        tile.className="tile gray";

        city.appendChild(tile);
    }
}

/* ===== CREATE CARDS ===== */

function createCards(pairs,columns){

    const cards=document.getElementById("cards");

    cards.innerHTML="";

    cards.style.gridTemplateColumns=
    `repeat(${columns},1fr)`;

    const chosen=icons.slice(0,pairs);

    const values=[...chosen,...chosen]
    .sort(()=>Math.random()-0.5);

    values.forEach(icon=>{

        const card=document.createElement("div");

        card.className="card";

        card.dataset.icon=icon;

        card.innerHTML="?";

        card.onclick=()=>flip(card);

        cards.appendChild(card);

    });
}

/* ===== FLIP ===== */

function flip(card){

    if(lock) return;
    if(card===first) return;
    if(card.classList.contains("done")) return;

    card.classList.add("open");

    card.innerHTML=card.dataset.icon;

    if(!first){

        first=card;
        return;
    }

    second=card;

    lock=true;

    if(first.dataset.icon===second.dataset.icon){

        first.classList.add("done");
        second.classList.add("done");

        matched++;

        greenTiles();

        reset();

        if(matched===totalPairs){

            document.getElementById("message")
            .innerHTML="🎉 Thành phố đã xanh hóa!";
        }
    }

    else{

        setTimeout(()=>{

            first.classList.remove("open");
            second.classList.remove("open");

            first.innerHTML="?";
            second.innerHTML="?";

            reset();

        },700);
    }
}

/* ===== GREEN ===== */

function greenTiles(){

    const tiles=document.querySelectorAll(".tile");

    let remain=tiles.length-greenIndex;

    let amount=
    Math.ceil(remain/(totalPairs-matched+1));

    for(let i=0;i<amount;i++){

        if(greenIndex<tiles.length){

            const tile=tiles[greenIndex];

            tile.classList.remove("gray");
            tile.classList.add("green");

            const tree=document.createElement("div");

            tree.className="tree";

            tree.innerHTML=
            ["🌳","🌲","🌴"]
            [Math.floor(Math.random()*3)];

            tree.style.left=Math.random()*60+"%";
            tree.style.top=Math.random()*60+"%";

            tile.appendChild(tree);

            for(let j=0;j<4;j++){

                const flower=document.createElement("div");

                flower.className="flower";

                flower.innerHTML=
                ["🌸","🌼","🌻"]
                [Math.floor(Math.random()*3)];

                flower.style.left=Math.random()*80+"%";
                flower.style.top=Math.random()*80+"%";

                tile.appendChild(flower);
            }

            greenIndex++;
        }
    }

    document.getElementById("score")
    .innerHTML="🌱 "+greenIndex;
}

/* ===== RESET ===== */

function reset(){

    first=null;
    second=null;
    lock=false;
}

/* ===== MENU ===== */

function backMenu(){

    const game=document.getElementById("game");

    game.classList.remove("show");

    game.style.display="none";

    document.getElementById("menu").style.display="flex";
}

/* ===== GUIDE ===== */

function openGuide(){

    document.getElementById("guidePage")
    .style.display="flex";
}

function closeGuide(){

    document.getElementById("guidePage")
    .style.display="none";
}

</script>

</body>
</html>
